chat_updates:
  - id: CHAT-001
    timestamp: 2026-09-04
    wording: supplement
    content: 参考 Switch《西洋骨牌》牌桌关系；改为 2D 双人 / 三人牌桌原型，先验证横向牌链与拖拽流程。
    supersedes: []
    affected_requirements: [REQ-001, REQ-002, REQ-003]
    version_impact: structural
  - id: CHAT-002
    timestamp: 2026-09-04
    wording: supplement
    content: 双人或三人本地 AI 对战；素材使用用户目录中的 Kenney Domino Pack 2D 图片，界面素材方向限定 Kenney Interface。
    supersedes: [CHAT-001]
    affected_requirements: [REQ-001, REQ-002, REQ-003, REQ-004]
    version_impact: structural
  - id: CHAT-003
    timestamp: 2026-09-04
    wording: correction
    content: 旧版仍像扑克/麻将换皮；改为参考视频中的整桌蛇形骨牌路径、上沿对手、左下玩家席位，人数可选为双人或三人，牌多时转弯而非缩放或叠压。
    supersedes: [CHAT-001, CHAT-002]
    affected_requirements: [REQ-003, REQ-004, REQ-005]
    version_impact: structural

source_policy:
  confirmed_user_request:
    - 新建独立骨牌玩法
    - 使用 2D Web 原型方向
    - Kenney Domino Pack 2D 图片与 Kenney Interface/UI 素材
    - 先设计原型图
