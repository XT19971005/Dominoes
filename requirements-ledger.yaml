  live_reference_screens: []
  reference_figma: []
  embedded_ai_html: []
  unverified_images: []

confidence:
  confirmed: [REQ-001, REQ-002, REQ-003, REQ-009]
  assumption: [REQ-004, REQ-005]
  pending: [REQ-006, REQ-007, REQ-008]
  pending-conflict: []
  superseded: []

requirements:
  - id: REQ-001
    source_refs: [CHAT-001]
    type: goal
    confidence: confirmed
    statement: 新建独立骨牌对战玩法，先用 2D Web 原型验证牌桌与交互。
    player_visible_result: 有独立的骨牌对战入口和牌桌。
    acceptance: 原型不依赖旧游戏页面，入口、牌桌、结果均可审阅。
    affected_states: [ST-00, ST-01, ST-04]
    owner: 产品 / UE
  - id: REQ-002
    source_refs: [CHAT-001, https://kenney.nl/assets, https://quaternius.com/index.html]
    type: visual
    confidence: confirmed
    statement: 骨牌使用 Kenney Domino Pack 的 Light、Dark、Gingerbread、Hearts、Stars 五套 2D PNG；界面只从 Kenney Interface/UI 资源方向筛选，原型不混用 3D 素材。
    player_visible_result: 牌面、牌背、桌面、头像均有明确资源槽位。
    acceptance: 玩家业务画面不塞入高保真材质；缺失资源标为占位。
    affected_states: [ST-00, ST-01, ST-02, ST-03, ST-04]
    owner: UE / UI / 美术
  - id: REQ-009
    source_refs: [CHAT-002, https://kenney.nl/assets/tag:interface]
    type: visual
    confidence: confirmed
    statement: 头像采用 2D 圆形座位标记；界面图标和按钮素材从 Kenney Interface/UI 方向筛选。
    player_visible_result: 当前模式中的每个座位都有清晰的头像标记，不遮挡牌桌和牌链。
    acceptance: 不引入 3D 角色或外部 IP，缺失头像用占位标注。
    affected_states: [ST-00, ST-01, ST-04]
    owner: 产品 / UI / 美术
  - id: REQ-003
    source_refs: [CHAT-003, https://www.bilibili.com/video/BV1co4y1z7FQ/]
    type: flow
    confidence: assumption
    statement: 牌桌采用参考视频式席位：玩家在左下；双人时 1 名对手顶部居中，三人时 2 名对手沿上边左右排列，信息直接贴桌边。
    player_visible_result: 中央牌路不被左右玩家卡片切断，当前模式的对手牌数和牌背仍清晰可辨。
    acceptance: 入口可选择双人或三人，牌桌显示与人数一致，不出现隐藏座位或人数误导。
    affected_states: [ST-01, ST-02, ST-03]
    owner: 产品
  - id: REQ-004
    source_refs: [用户此前关于上下左右连接的聊天]
    type: goal
    confidence: assumption
    statement: 骨牌在蛇形牌链的两个真实端点连接，相同点数才可接；到达桌边后转弯延伸。
    player_visible_result: 选牌后两个链端高亮，普通牌顺着路径，双牌垂直主链。
    acceptance: 牌面保持可读尺寸，不整体缩小、不压叠；点击手牌不会直接出牌。
    affected_states: [ST-02, ST-03]
    owner: 产品 / 程序
  - id: REQ-005
    source_refs: [用户此前关于拖牌手感的聊天]
    type: visual
    confidence: assumption
    statement: 选牌、拖拽、接点高亮、落牌反馈需要清晰可见。
    player_visible_result: 选中的牌上浮，接点扩大，落牌后显示吸附反馈。
    acceptance: 操作反馈不依赖小字，关键反馈使用大号标签或气泡。
    affected_states: [ST-02, ST-03]
    owner: UE / 程序
  - id: REQ-006
    source_refs: []
    type: technical
    confidence: pending
    statement: 当前原型锁定横屏 1334×750 2D 视图；不进入 3D 相机实现。
    player_visible_result: ""
    acceptance: 实现前锁定横屏/竖屏及相机方案。
    affected_states: [ST-00, ST-01]
    owner: 产品
  - id: REQ-007
    source_refs: []
    type: goal
    confidence: pending
    statement: 计分和结束条件待确认。
    player_visible_result: ""
    acceptance: 实现前形成可执行规则表。
    affected_states: [ST-03, ST-04]
    owner: 产品
  - id: REQ-008
    source_refs: []
    type: technical
    confidence: pending
    statement: 本轮使用本地 AI 占位；联网房间不在原型范围。
    player_visible_result: ""
    acceptance: 实现前锁定对手来源和断线恢复策略。
    affected_states: [ST-01, ST-03, ST-04]
    owner: 产品 / 程序

